name: Build

on:
  workflow_dispatch:
  push:
    branches:
      - 'dev-v*-proxy'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Regenerate Debian keyring
        run: |
          rm -f ./naiveproxy/src/build/linux/sysroot_scripts/keyring.gpg
          GPG_TTY=/dev/null ./naiveproxy/src/build/linux/sysroot_scripts/generate_keyring.sh
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-linux-amd64
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ccache-linux-amd64-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-linux-amd64-
      - name: Install packages
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt update
          sudo apt install -y ninja-build ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=linux/amd64 build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=linux/amd64 package --local
          go run ./cmd/build-naive --target=linux/amd64 package
      - name: Cache toolchain
        uses: actions/cache@v4
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-amd64-${{ steps.chromium.outputs.version }}
          restore-keys: toolchain-linux-amd64-
      - name: Download clang and sysroot
        run: go run ./cmd/build-naive --target=linux/amd64 download-toolchain
      - name: Build test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/amd64 env --export)
          CGO_ENABLED=1 GOOS=linux GOARCH=amd64 go test -c -o cronet.test .
      - name: Run test binary
        run: |
          eval $(go run ./cmd/build-naive --target=linux/amd64 env --export)
          ./cronet.test -test.v -test.run=TestEngineVersion
      - name: Build purego test binary
        run: |
          cp lib/linux_amd64/libcronet.so .
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go test -tags with_purego -c -o cronet.purego.test .
      - name: Run purego test binary
        run: |
          export LD_LIBRARY_PATH=$PWD
          ./cronet.purego.test -test.v -test.run=TestEngineVersion
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-linux-amd64
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go
            !**/*.so
            !**/libcronet_purego.go

  darwin:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'
      - uses: actions/setup-go@v5
        with:
          go-version: ^1.25
      - name: Get naiveproxy commit
        id: naive
        run: echo "commit=$(git -C naiveproxy rev-parse HEAD)" >> $GITHUB_OUTPUT
      - name: Get Chromium version
        id: chromium
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT
      - name: Cache build artifacts
        id: build-cache
        uses: actions/cache@v4
        with:
          path: naiveproxy/src/out
          key: naive-build-${{ steps.naive.outputs.commit }}-${{ hashFiles('cmd/build-naive/cmd_build.go', 'cmd/build-naive/cmd.go') }}-darwin-arm64
      - name: Cache ccache files
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/Library/Caches/ccache
          key: ccache-darwin-arm64-${{ steps.chromium.outputs.version }}
          restore-keys: ccache-darwin-arm64-
      - name: Install tools
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: brew install ninja ccache
      - name: Reset ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -z
      - name: Build
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: go run ./cmd/build-naive --target=darwin/arm64 build
      - name: Show ccache stats
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: ccache -s
      - name: Package
        run: |
          go run ./cmd/build-naive --target=darwin/arm64 package --local
          go run ./cmd/build-naive --target=darwin/arm64 package
      - name: Build and run test binary
        run: |
          CGO_ENABLED=1 go test -c -o cronet.test .
          ./cronet.test -test.v -test.run=TestEngineVersion
      - uses: actions/upload-artifact@v4
        with:
          name: cronet-darwin-arm64
          path: |
            lib/
            include/
            include_cgo.go
            lib_*_cgo.go
            !**/*.so
            !**/libcronet_purego.go

  integration-test:
    if: github.event_name != 'workflow_dispatch'
    needs: [linux, darwin]
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-amd64-cgo
            os: ubuntu-22.04
            artifact: cronet-linux-amd64
            target: linux/amd64
            mode: cgo
          - name: darwin-arm64-cgo
            os: macos-15
            artifact: cronet-darwin-arm64
            target: darwin/arm64
            mode: cgo
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CRONET_TEST_ARTIFACT_DIR: ${{ github.workspace }}/test-artifacts/${{ matrix.name }}
      CRONET_TEST_CAPTURE_NETLOG: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: 'recursive'

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.24

      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: .

      - name: Get Chromium version
        id: chromium
        shell: bash
        run: echo "version=$(cat naiveproxy/CHROMIUM_VERSION)" >> $GITHUB_OUTPUT

      - name: Restore toolchain cache (Linux)
        if: runner.os == 'Linux'
        uses: actions/cache/restore@v4
        with:
          path: |
            naiveproxy/src/third_party/llvm-build
            naiveproxy/src/gn/out
            naiveproxy/src/chrome/build/pgo_profiles
            naiveproxy/src/out/sysroot-build
          key: toolchain-linux-amd64-${{ steps.chromium.outputs.version }}
          restore-keys: toolchain-linux-amd64-

      - name: Download toolchain (Linux)
        if: runner.os == 'Linux'
        run: go run ./cmd/build-naive --target=${{ matrix.target }} download-toolchain

      - name: Install iperf3 (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt update
          sudo apt install -y iperf3

      - name: Install iperf3 (macOS)
        if: runner.os == 'macOS'
        run: brew install iperf3

      - name: Run integration tests (CGO)
        if: matrix.mode == 'cgo'
        timeout-minutes: 20
        run: |
          mkdir -p "$CRONET_TEST_ARTIFACT_DIR"
          eval $(go run ./cmd/build-naive --target=${{ matrix.target }} env --export)
          cd test
          LOG_PATH="$CRONET_TEST_ARTIFACT_DIR/go-test.log"
          if ! CGO_ENABLED=1 go test -v -timeout=12m >"$LOG_PATH" 2>&1; then
            tail -n 400 "$LOG_PATH" || true
            exit 1
          fi

      - name: Upload integration logs (test failure)
        if: always() && (failure() || cancelled())
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ matrix.name }}
          path: test-artifacts/${{ matrix.name }}/
          if-no-files-found: warn

  publish:
    if: github.event_name == 'push'
    needs: [linux, darwin]
    runs-on: ubuntu-22.04
    env:
      TARGET_BRANCH: go-${{ github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: ^1.22

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts/

      - name: Merge artifacts
        run: |
          for dir in artifacts/cronet-*/; do
            cp -r "$dir"/* .
          done
          ls -laR lib/ include/ include_cgo.go

      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Publish
        run: go run ./cmd/build-naive publish --branch ${{ env.TARGET_BRANCH }}
